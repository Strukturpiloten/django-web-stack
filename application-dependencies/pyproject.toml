[project]
name = "django-stack-lock-project"
version = "0.1.0"
description = "Application dependency source"
readme = "README.md"
requires-python = ">=3.15,<3.16"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "Django~=6.1.3",
    "django-ninja>=1.5,<2",
    "pydantic>=2.12,<3",
    "celery~=5.7.0",
    "psycopg[binary]>=3.3,<4",
    "uvicorn[standard]>=0.40,<1",
    "whitenoise>=6.11,<7",
    "django-allauth[headless,socialaccount]>=65.22.1,<66",
    "opentelemetry-sdk>=1.39,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.39,<2",
    "opentelemetry-instrumentation-django>=0.60b0,<1",
    "opentelemetry-instrumentation-celery>=0.60b0,<1",
    "opentelemetry-instrumentation-psycopg>=0.60b0,<1",
    "opentelemetry-instrumentation-logging>=0.60b0,<1",
]

[project.optional-dependencies]
valkey = ["redis>=8.1,<9"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9,<10",
    "pytest-django>=4.12,<5",
    "ruff>=0.14,<1",
]
browser = ["playwright>=1.56,<2"]

[tool.hatch.build.targets.wheel]
packages = ["src/django_stack_lock_project"]

[tool.hatch.build]
artifacts = ["src/django_stack_lock_project/static/**", "src/django_stack_lock_project/templates/**"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-config", "--strict-markers", "--import-mode=importlib"]
xfail_strict = true
DJANGO_SETTINGS_MODULE = "django_stack_lock_project.settings"
markers = ["browser: real browser and RabbitMQ integration (opt in with RUN_BROWSER_TESTS=1)"]
