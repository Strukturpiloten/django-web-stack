[project]
name = "django-web-stack"
dynamic = ["version"]
description = "Copier starter template for Django projects"
readme = "README.md"
requires-python = ">=3.15,<3.16"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.urls]
Repository = "https://github.com/Strukturpiloten/django-web-stack"
Issues = "https://github.com/Strukturpiloten/django-web-stack/issues"

[dependency-groups]
dev = [
    "build>=1.3,<2",
    "copier>=9.19,<10",
    "cvss>=3.6,<4",
    "hatchling>=1.27,<2",
    "pytest>=9,<10",
    "pyyaml>=6,<7",
    "ruff>=0.14,<1",
]

# uv reads project metadata for this tooling environment.
[tool.setuptools]
packages = []

[tool.uv]
# This repository contains a template, not an installable application.
package = false

[tool.ruff]
line-length = 100
extend-exclude = ["template", "temp"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-config", "--strict-markers", "--import-mode=importlib"]
xfail_strict = true
