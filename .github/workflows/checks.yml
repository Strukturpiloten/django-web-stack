name: Template checks

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, ready_for_review]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: template-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      lanes: ${{ steps.plan.outputs.lanes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: plan
        name: Select checks from the base revision
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ -n "$BASE" ]] && git cat-file -e "$BASE:.github/ci/plan.py"; then
            git show "$BASE:.github/ci/plan.py" > "$RUNNER_TEMP/plan.py"
            lanes=$(python -I "$RUNNER_TEMP/plan.py" --diff "$BASE" "$HEAD")
          else
            lanes=$(python -I .github/ci/plan.py)
          fi
          echo "lanes=$lanes" >> "$GITHUB_OUTPUT"
          echo "Selected checks: $lanes" >> "$GITHUB_STEP_SUMMARY"

  test:
    name: ${{ matrix.lane }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        lane: ${{ fromJSON(needs.plan.outputs.lanes) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        if: matrix.lane != 'docs'
        with:
          version: "0.13.9"
          python-version: "3.15"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: matrix.lane == 'frontend' || matrix.lane == 'renovate'
        with:
          node-version: "24"
      - name: Run selected check
        env:
          LANE: ${{ matrix.lane }}
          BASE: ${{ github.event.pull_request.base.sha }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          GH_TOKEN: ${{ github.token }}
        run: bash .github/ci/check.sh
      - uses: DavidAnson/markdownlint-cli2-action@696eb3f2509270d7b882d2aa68347bc676e7af34 # v25.0.0
        if: matrix.lane == 'docs' || matrix.lane == 'rendered-docs'
        with:
          globs: |
            ${{ matrix.lane == 'docs' && '**/*.md' || 'temp/*/**/*.md' }}
            #template
            #node_modules
            #.venv
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        if: matrix.lane == 'docs' || matrix.lane == 'rendered-docs'
        with:
          args: --offline --include-fragments --no-progress '${{ matrix.lane == 'docs' && './**/*.md' || './temp/*/**/*.md' }}'
          failIfEmpty: false

  required:
    name: Required CI
    if: always()
    needs: [plan, test]
    runs-on: ubuntu-latest
    steps:
      - name: Require the plan and every selected check
        env:
          PLAN: ${{ needs.plan.result }}
          TEST: ${{ needs.test.result }}
        run: test "$PLAN" = success && test "$TEST" = success
