name: External documentation links
on:
  schedule:
    - cron: '29 4 * * 3'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.9"
          python-version: "3.15"
      - run: |
          for mode in full api-only; do
            uv run --locked copier copy --quiet --defaults --vcs-ref HEAD -d "default_mode=$mode" . "temp/$mode"
          done
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --max-concurrency 3 --exclude-loopback --no-progress './*.md' './temp/*/**/*.md'
          token: ${{ github.token }}
