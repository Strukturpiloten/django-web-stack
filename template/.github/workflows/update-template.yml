name: Update Django template

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

concurrency:
  group: update-django-template

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Find the latest successful template commit on main
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source_url=$(yq -er '._src_path' .copier-answers.yml)
          source_url=${source_url%/}
          if [[ ! ${source_url%.git} =~ ^https://github\.com/([A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+)$ ]]; then
            echo "::notice::Automatic updates use a GitHub HTTPS template URL. For this source, run Copier manually."
            exit 0
          fi
          repo=${BASH_REMATCH[1]}
          current=$(yq -er '._commit' .copier-answers.yml)
          target=$(gh api "repos/$repo/actions/workflows/checks.yml/runs?branch=main&event=push&status=success&per_page=1" \
            --jq '.workflow_runs[0].head_sha // empty')
          if [[ -z $target || $target == "$current" ]]; then
            exit 0
          fi
          [[ $current =~ ^[0-9a-f]{7,40}$ && $target =~ ^[0-9a-f]{40}$ ]]
          status=$(gh api "repos/$repo/compare/$current...$target" --jq .status)
          case "$status" in
            ahead) ;;
            identical|behind) exit 0 ;;
            *) echo "::error::Template histories have diverged. Review the commits manually."; exit 1 ;;
          esac
          echo "target=$target" >> "$GITHUB_OUTPUT"
          echo "comparison=https://github.com/$repo/compare/$current...$target" >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        if: steps.upstream.outputs.target != ''
        with:
          version: "0.13.9"
          python-version: "3.15"
      - name: Apply the selected commit
        if: steps.upstream.outputs.target != ''
        env:
          TARGET: ${{ steps.upstream.outputs.target }}
        run: |
          uvx --from copier==9.19.1 copier update --defaults --vcs-ref "$TARGET"
          if [[ -n $(git ls-files --unmerged) || -n $(git ls-files --others --exclude-standard -- '*.rej') ]]; then
            echo "::error::Copier found conflicts. Run the update locally and resolve them."
            exit 1
          fi
          test "$(yq -er '._commit' .copier-answers.yml)" = "$TARGET"
      - uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        if: steps.upstream.outputs.target != ''
        with:
          token: ${{ secrets.TEMPLATE_UPDATE_TOKEN || github.token }}
          branch: automation/update-django-template
          base: ${{ github.event.repository.default_branch }}
          title: Update Django template
          commit-message: Update Django template to ${{ steps.upstream.outputs.target }}
          body: |
            Apply upstream commit `${{ steps.upstream.outputs.target }}`.

            [Review the upstream changes](${{ steps.upstream.outputs.comparison }}) together with the generated diff and application checks.
